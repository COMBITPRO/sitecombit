media:
  input: public/images
  output: /images

settings:
  content:
    merge: true

components:
  rich_text:
    type: rich-text
    description: "Можно форматировать выделенные фрагменты: жирный, курсив, ссылки, списки и другие доступные в редакторе элементы."
    options:
      format: html
      media: false
      switcher: false

content:
  - name: site
    label: Содержимое сайта
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: seo
        label: Поисковая выдача
        type: object
        fields:
          - { name: title, label: Заголовок страницы, type: string, required: true }
          - { name: description, label: Описание страницы, type: text, required: true }

      - name: navigation
        label: Меню
        type: object
        list: { min: 0 }
        fields:
          - { name: label, label: Название, type: string, required: true }
          - { name: href, label: Ссылка, type: string, required: true }

      - name: contact
        label: Контактные данные
        type: object
        fields:
          - { name: phone, label: Телефон, type: string, required: true }
          - { name: fax, label: Факс, type: string }
          - { name: email, label: Электронная почта, type: string, required: true }
          - { name: address, label: Адрес, type: text, required: true }
          - { name: headerCta, label: Подпись под телефоном, type: string, required: true }

      - name: hero
        label: Первый экран
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок — первая строка, type: string, required: true }
          - { name: accentTitle, label: Заголовок — акцентная строка, type: string, required: true }
          - { name: description, label: Описание, component: rich_text }
          - { name: image, label: Фоновое изображение, type: image, required: true }
          - { name: primaryButton, label: Основная кнопка, type: string, required: true }
          - { name: secondaryButton, label: Дополнительная кнопка, type: string, required: true }
          - name: facts
            label: Показатели
            type: object
            list:
              min: 0
              collapsible: { collapsed: false, summary: "{value} — {label}" }
            fields:
              - { name: value, label: Значение, type: string, required: true }
              - { name: label, label: Подпись, type: string, required: true }

      - name: dealer
        label: Статус дилера
        type: object
        fields:
          - { name: title, label: Заголовок, component: rich_text, required: true }
          - { name: description, label: Описание, component: rich_text }
          - { name: label, label: Метка справа, component: rich_text, required: true }

      - name: about
        label: О компании
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: description, label: Описание, component: rich_text }
          - { name: image, label: Изображение, type: image, required: true }
          - { name: imageAlt, label: Описание изображения, type: string, required: true }
          - { name: stampValue, label: Число на плашке, type: string, required: true }
          - { name: stampText, label: Текст на плашке, type: string, required: true }
          - { name: industries, label: Отрасли, component: rich_text, list: { min: 0 }, required: true }

      - name: equipment
        label: Оборудование
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text }
          - name: groups
            label: Группы оборудования
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{label}" }
            fields:
              - { name: id, label: Технический идентификатор, description: "Уникальное значение латиницей, например: ulm-42.", type: string, required: true }
              - { name: label, label: Название вкладки, type: string, required: true }
              - { name: summary, label: Описание группы, component: rich_text, required: true }
              - name: models
                label: Модели
                type: object
                list:
                  min: 0
                  collapsible: { collapsed: true, summary: "{title}" }
                fields:
                  - { name: id, label: Технический идентификатор, description: "Уникальное значение латиницей для ссылки на модель, например: ulm-42.", type: string, required: true }
                  - { name: image, label: Изображение, type: image, required: true }
                  - { name: alt, label: Описание изображения, type: string, required: true }
                  - { name: featured, label: Показывать первой в серии, type: boolean, default: false }
                  - { name: title, label: Название, type: string, required: true }
                  - { name: description, label: Описание, component: rich_text }
                  - name: technicalSpecifications
                    label: Подробные технические характеристики
                    description: После добавления хотя бы одной строки на сайте появится отдельный раскрываемый блок.
                    type: object
                    list:
                      min: 0
                      collapsible: { collapsed: true, summary: "{parameter}" }
                    fields:
                      - { name: parameter, label: Параметр, type: string, required: true }
                      - { name: value, label: Значение, type: string, required: true }
                  - name: files
                    label: Документы
                    type: object
                    list:
                      min: 0
                      collapsible: { collapsed: true, summary: "{label}" }
                    fields:
                      - { name: label, label: Название, type: string, required: true }
                      - { name: href, label: Путь к файлу, type: string, required: true }
                      - { name: format, label: Формат, type: string, required: true }
          - { name: additionalTitle, label: Заголовок дополнительных решений, type: string, required: true }
          - { name: additionalLead, label: Вводный текст дополнительных решений, component: rich_text }
          - name: additionalSolutions
            label: Дополнительные решения
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Название, type: string, required: true }
              - { name: description, label: Описание, component: rich_text }

      - name: services
        label: Услуги
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text }
          - name: items
            label: Список услуг
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Название, type: string, required: true }
              - { name: description, label: Описание, component: rich_text }

      - name: advantages
        label: Преимущества
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: closing, label: Заключительный текст, component: rich_text }
          - name: items
            label: Список преимуществ
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Название, type: string, required: true }
              - { name: description, label: Описание, component: rich_text }

      - name: company
        label: О компании — подробный блок
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text }
          - { name: directionsTitle, label: Заголовок направлений, type: string, required: true }
          - name: directions
            label: Направления деятельности
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Название, type: string, required: true }
              - { name: items, label: Пункты, component: rich_text, list: { min: 0 }, required: true }

      - name: projects
        label: Проекты и показатели
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text }
          - name: stats
            label: Показатели
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{value}{suffix}" }
            fields:
              - { name: value, label: Значение, type: string, required: true }
              - { name: suffix, label: Суффикс, type: string }
              - { name: description, label: Описание, component: rich_text }
          - { name: items, label: Реализованные проекты, component: rich_text, list: { min: 0 }, required: true }
          - { name: afterword, label: Текст после проектов, component: rich_text }
          - { name: constructionTitle, label: Заголовок строительных работ, type: string }
          - { name: constructionItems, label: Строительные работы, component: rich_text, list: { min: 0 } }

      - name: clients
        label: Заказчики
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text }
          - name: items
            label: Логотипы заказчиков
            type: object
            list:
              min: 0
              collapsible: { collapsed: true, summary: "{alt}" }
            fields:
              - { name: image, label: Логотип, type: image, required: true }
              - { name: alt, label: Название компании, type: string, required: true }
          - { name: names, label: Список заказчиков без логотипов, component: rich_text, list: { min: 0 } }
          - { name: closing, label: Заключительный текст, component: rich_text }

      - name: contactSection
        label: Форма связи
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string, required: true }
          - { name: title, label: Заголовок, type: string, required: true }
          - { name: lead, label: Вводный текст, component: rich_text, required: true }
          - name: form
            label: Тексты формы
            type: object
            fields:
              - { name: title, label: Заголовок, type: string, required: true }
              - { name: lead, label: Описание, component: rich_text, required: true }
              - { name: nameLabel, label: Поле имени, type: string, required: true }
              - { name: companyLabel, label: Поле компании, type: string, required: true }
              - { name: contactLabel, label: Поле контакта, type: string, required: true }
              - { name: messageLabel, label: Поле задачи, type: string, required: true }
              - { name: consent, label: Согласие, type: text, required: true }
              - { name: button, label: Кнопка, type: string, required: true }
              - { name: sending, label: Кнопка при отправке, type: string, required: true }
              - { name: ready, label: Подпись готовой формы, type: string, required: true }
              - { name: unavailable, label: Форма не настроена, type: string, required: true }
              - { name: pending, label: Статус отправки, type: string, required: true }
              - { name: success, label: Успешная отправка, type: string, required: true }
              - { name: error, label: Ошибка отправки, type: string, required: true }

      - name: footer
        label: Подвал
        type: object
        fields:
          - { name: description, label: Описание компании, component: rich_text, required: true }
          - { name: sectionsTitle, label: Заголовок разделов, type: string, required: true }
          - { name: contactsTitle, label: Заголовок контактов, type: string, required: true }
          - name: links
            label: Ссылки
            type: object
            list: { min: 0 }
            fields:
              - { name: label, label: Название, type: string, required: true }
              - { name: href, label: Ссылка, type: string, required: true }
          - { name: copyright, label: Правообладатель, type: string, required: true }
          - { name: disclaimer, label: Примечание, type: string, required: true }
